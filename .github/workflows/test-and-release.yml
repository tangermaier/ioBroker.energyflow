name: Test and Release

# Lint, type checks, unit/package tests and full builds on every push and pull request.
# Deliberately without an npm deploy job for now (releases are published manually).

on:
    push:
        branches:
            - "main"
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+**"
    pull_request: {}

concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: npm
            - run: npm ci
            # The widget and scene sub-projects must be installed BEFORE linting: the root eslint
            # config type-checks their sources, and without their node_modules React/maplibre
            # types resolve to "any" and trigger type-aware lint errors.
            - name: Install widget and scene dependencies
              run: |
                  npm ci --prefix src-widgets
                  npm ci --prefix src-scene
            - name: Type check (adapter)
              run: npm run check
            - name: Lint
              run: npm run lint
            - name: Build adapter, widgets and scene
              run: npm run build:all
            - name: License check
              run: node tools/generate-notices.mjs --check

    adapter-tests:
        if: contains(github.event.head_commit.message, '[skip ci]') == false
        needs: [check-and-lint]
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                node-version: [20.x, 22.x]
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - run: npm run build
            - name: Unit and package tests
              run: npm test
